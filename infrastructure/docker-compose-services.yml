      - BPL_JVM_HEAD_ROOM=0
    depends_on:
      catalog:
        condition: service_healthy
      iam:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ecom-network
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Config Server
  config-server:
    image: ${CONFIG_SERVER_IMAGE:-subhm4dev/nexus-config-server:latest}
    container_name: nexus-config-server
    ports:
      - "8888:8888"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USERNAME=${GITHUB_USERNAME:-subhm4dev}
      - CONFIG_REPO_URI=${CONFIG_REPO_URI:-https://github.com/subhm4dev/nexus-platform.git}
      - JAVA_OPTS=-Xmx512m -Xms256m
      - BPL_JVM_THREAD_COUNT=50
      - BPL_JVM_HEAD_ROOM=0
    networks:
      - ecom-network
    mem_limit: 1.5g
    restart: unless-stopped
    # Healthcheck disabled - container is distroless (no shell). Service health can be verified via:
    # curl http://localhost:8888/actuator/health
    # The service is working correctly as verified by the health endpoint

  # Gateway Service
  gateway:
    image: ${GATEWAY_IMAGE:-subhm4dev/nexus-shared-gateway:latest}
    container_name: nexus-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - IDENTITY_SERVICE_URL=http://iam:8080
      - JAVA_OPTS=-Xmx256m -Xms128m
      - BPL_JVM_THREAD_COUNT=50
      - BPL_JVM_HEAD_ROOM=0
    depends_on:
      config-server:
        condition: service_started
      iam:
        condition: service_started
    networks:
      - ecom-network
    mem_limit: 768m
    restart: unless-stopped
    # Healthcheck disabled - container is distroless (no shell). Service health can be verified via:
    # curl http://localhost:8080/actuator/health
    # The service is working correctly as verified by the startup logs

  # Cart Service
  cart:
    image: ${CART_IMAGE:-subhm4dev/nexus-ecommerce-cart:latest}
