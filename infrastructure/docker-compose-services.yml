version: '3.8'

services:
  # IAM Service
  iam:
    image: ${IAM_IMAGE:-subhm4dev/nexus-shared-iam:latest}
    container_name: nexus-iam
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ecom_iam
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - PASSWORD_PEPPER=${PASSWORD_PEPPER}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - JAVA_OPTS=-Xmx256m -Xms128m
      - BPL_JVM_THREAD_COUNT=50
      - BPL_JVM_HEAD_ROOM=0
    depends_on:
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecom-network
    mem_limit: 768m
    restart: unless-stopped
    # Note: Healthcheck disabled because distroless containers don't have shell/tools
    # Gateway will retry connecting to IAM (it has restart: unless-stopped)
    # IAM typically takes ~105 seconds to fully start
    # Gateway's JWKS initialization will retry until IAM is ready

  # User Profile Service
  user-profile:
    image: ${USER_PROFILE_IMAGE:-subhm4dev/nexus-shared-user-profile:latest}
    container_name: nexus-user-profile
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ecom_user_profile
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - IDENTITY_SERVICE_URL=http://iam:8080
      - JAVA_OPTS=-Xmx256m -Xms128m
      - BPL_JVM_THREAD_COUNT=50
      - BPL_JVM_HEAD_ROOM=0
    depends_on:
      gateway:
        condition: service_started
      iam:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ecom-network
    mem_limit: 768m
    restart: unless-stopped

  # Address Service
  address:
    image: ${ADDRESS_IMAGE:-subhm4dev/nexus-shared-address:latest}
    container_name: nexus-address
    ports:
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ecom_address
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - IDENTITY_SERVICE_URL=http://iam:8080
      - JAVA_OPTS=-Xmx256m -Xms128m
      - BPL_JVM_THREAD_COUNT=50
      - BPL_JVM_HEAD_ROOM=0
    depends_on:
      user-profile:
        condition: service_started
      iam:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecom-network
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Payment Service
  payment:
    image: ${PAYMENT_IMAGE:-subhm4dev/nexus-shared-payment:latest}
    container_name: nexus-payment
    ports:
      - "8089:8080"
    environment:
